services:
    - serviceId: sysviewautomation  # unique lowercase ID of the service
      catalogUiTileId: automation  # ID of the API Catalog UI tile (visual grouping of the services)
      title: Automation Service  # Title of the service in the API catalog
      description: Automate usage of Sysview from Python  # Description of the service in the API catalog
      instanceBaseUrls:  # list of base URLs for each instance
          - http://localhost:8081/  # scheme://hostname:port/contextPath
      homePageRelativeUrl:  # Normally used for informational purposes for other services to use it as a landing page
      routes:
          - gatewayUrl: api/v1 # [api/ui/ws]/v{majorVersion}
            serviceRelativeUrl:  # relativePath that is added to baseUrl of an instance
          # List of APIs provided by the service (currently only one is supported):
      authentication:
          scheme: bypass     # This service expects z/OSMF LTPA token
      apiInfo:
          - apiId: com.example
            gatewayUrl: api
            version: 1.0.0
    
catalogUiTiles:
    automation:
        title: Automation Service
        description: Service using sysview to automate.     